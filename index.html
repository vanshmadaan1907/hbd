
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            color: #fff;
            text-shadow: 2px 3px 8px #e75480;
            animation: bounce 2s infinite;
        }

        h2 {
            margin: 20px 0;
            color: #fff;
            font-size: 1.8rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .cake {
            font-size: 100px;
            margin: 15px 0;
            animation: float 3s ease-in-out infinite;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        button:hover {
            background: #e91e63;
            transform: scale(1.08);
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            font-size: 50px;
            animation: rise 10s linear infinite;
            z-index: 1;
        }

        .balloon:nth-child(1) { left: 5%; animation-delay: 0s; }
        .balloon:nth-child(2) { left: 25%; animation-delay: 3s; }
        .balloon:nth-child(3) { left: 70%; animation-delay: 1s; }
        .balloon:nth-child(4) { left: 90%; animation-delay: 5s; }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #fff;
            font-weight: bold;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes rise {
            from { bottom: -150px; transform: rotate(0deg); }
            to { bottom: 110%; transform: rotate(20deg); }
        }

        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 15px;
            z-index: 5;
            pointer-events: none;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Floating balloons -->
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>

    <div class="container">
        <h1>🎉 Happy Birthday! 🎉</h1>

        <!-- Change the name below -->
        <h2>Dear Best Friend ❤️</h2>

        <div class="cake">🎂</div>

        <p>
            Wishing you a day filled with love, laughter,
            happiness, and unforgettable memories!
            May all your dreams come true. ✨
        </p>

        <button onclick="celebrate()">
            🎁 Click for a Surprise!
        </button>

        <div id="message">
            💖 You are amazing! Have the best birthday ever! 💖
        </div>
    </div>

    <script>
        function celebrate() {
            document.getElementById("message").style.display = "block";

            // Create colorful confetti
            const colors = [
                "#ff4081", "#ffd700", "#00e5ff",
                "#7c4dff", "#76ff03", "#ffffff"
            ];

            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";

                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor =
                    colors[Math.floor(Math.random() * colors.length)];

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                confetti.style.animationDelay =
                    Math.random() * 0.8 + "s";

                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 6000);
            }
        }
    </script>

</body>
</html>
